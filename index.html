<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Javascript Nâng Cao - WEB2064</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body>
    <nav class="bg-blue-600 text-white shadow">
      <div
        class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between"
      >
        <strong>WEB2064 JSNC</strong>

        <div class="hidden md:flex items-center space-x-8">
          <a href="index.html" class="hover:text-gray-200">Danh sách</a>
          <a href="add.html" class="hover:text-gray-200">Thêm mới</a>
        </div>
        <div class="hidden md:flex items-center space-x-6"></div>
      </div>
    </nav>
    <div class="max-w-6xl mx-auto mt-10 px-4 text-center">
      <h1 id="title" class="text-2xl font-semibold mb-6">Danh sách sản phẩm</h1>
      <form id="productSearchForm" class="mb-6 flex flex-wrap justify-center gap-2">
        <label class="sr-only" for="productSearch">Tìm sản phẩm</label>
        <input
          id="productSearch"
          type="search"
          placeholder="Tìm theo tên, ID hoặc giá..."
          class="w-full max-w-md rounded border border-gray-300 px-3 py-2 text-left"
        />
        <button type="submit" class="rounded bg-blue-600 px-4 py-2 text-white hover:bg-blue-700">Tìm kiếm</button>
        <button id="clearSearch" type="button" class="rounded border border-gray-300 px-4 py-2 hover:bg-gray-100">Xóa</button>
      </form>


      <div class="overflow-x-auto">
        <table class="w-full border border-gray-300 rounded-lg">
          <thead class="bg-gray-100">
            <tr>
              <th class="px-4 py-2 border border-gray-300">STT</th>
              <th class="px-4 py-2 border border-gray-300">ID</th>
              <th class="px-4 py-2 border border-gray-300">Tên sản phẩm</th>
              <th class="px-4 py-2 border border-gray-300">Giá</th>
              <th class="px-4 py-2 border border-gray-300">Actions</th>
            </tr>
          </thead>

          <tbody id="products"></tbody>
        </table>
      </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.7.7/axios.min.js"></script>
    
    
    <script src="lab4.js"></script>
  </body>
</html>
